<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Plan">
<meta name="theme-color" content="#f6f4f1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>My Plan</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#ebe8e3;--red:#e8483f;--orange:#f39c35;--green:#2fa36b;--blue:#3b6fd8;--purple:#8d5bd6;--teal:#1f9e9a;--warn:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
header{padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:30px;margin:0;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:14px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{border:0;background:var(--card);width:38px;height:38px;border-radius:19px;font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{padding:0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.next{background:var(--ink);color:#fff}
.next .label{font-size:13px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.next .what{font-size:22px;font-weight:700;margin:6px 0 4px;line-height:1.25}
.next .when{opacity:.75;font-size:15px}
.next button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:17px;font-weight:700}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.check{flex:none;width:28px;height:28px;border-radius:14px;border:2px solid #cfcac3;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;margin-top:1px}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .t{color:var(--sub);text-decoration:line-through}
.task .t{font-size:17px;line-height:1.3}
.task .w{font-size:13px;color:var(--sub);margin-top:2px}
.pill{margin-top:8px;border:1px solid #dcd7d0;background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--blue)}
.pill.set{border-color:var(--green);color:var(--green);background:#eef8f2}
.act{display:flex;gap:8px;margin:8px 0 0 40px;flex-wrap:wrap}
.act label{flex:1;min-width:130px;font-size:12px;color:var(--sub)}
.act input{font-size:16px;padding:8px 10px;margin-top:3px}
.act .ok{color:var(--green);font-weight:700}
.taskwrap{border-top:1px solid var(--line);padding-bottom:10px}
.taskwrap:first-of-type{border-top:0}
.taskwrap .task{border-top:0}
.info{display:flex;gap:10px;padding:10px 12px;background:#fff7e8;border-radius:12px;font-size:15px;margin:8px 0;line-height:1.35}
.trip{background:#fdecea}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:22px;background:var(--bg);font-size:15px;font-weight:600;border:2px solid transparent}
.chip.on{background:#e6f5ec;border-color:var(--green);color:var(--green)}
.ringwrap{display:flex;align-items:center;gap:16px}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.row:first-of-type{border-top:0}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:5px}
.mlist .m{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.mlist .m:first-child{border-top:0}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;margin-left:6px}
.b18{background:#fdecea;color:var(--red)}.b5{background:#e6f5ec;color:var(--green)}.btrip{background:#efe6fb;color:var(--purple)}.baug{background:#e8f0fd;color:var(--blue)}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--sub);padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--red);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.panel h3{margin:4px 4px 8px;font-size:22px}
label.f{display:block;padding:10px 0;border-top:1px solid var(--line)}
label.f:first-of-type{border-top:0}
label.f span{display:block;font-size:14px;color:var(--sub);margin-bottom:6px}
input{width:100%;font-size:18px;padding:11px 12px;border:1px solid #dcd7d0;border-radius:12px;background:#fff;font-family:inherit}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:10px;background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink);border:1px solid #dcd7d0}
textarea{width:100%;height:110px;font-size:13px;border-radius:12px;border:1px solid #dcd7d0;padding:10px;font-family:ui-monospace,monospace}
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.warn{color:var(--warn);font-weight:700}
.small{font-size:13px;color:var(--sub);line-height:1.4}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<script>
const KEY='myplan.v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
(function(){const h=location.hash;if(!h.startsWith('#setup='))return;try{const N=JSON.parse(decodeURIComponent(escape(atob(h.slice(7)))));if(!S||(N.v||1)>(S.v||1)){N.done=(S&&S.done)||{};N.actual=(S&&S.actual)||{};S=N;save()}}catch(e){}})();
if(!S)S={v:0,settings:{gross:0,trips:[],flights:[],leave:[],lunchMonths:[],highTaxMonths:[],refunds:{},start:"2026-11",end:"2028-08"},actual:{},done:{}};
// ---- upgrade to v4 (keeps your settings, replaces flights with one-way legs, clears old "real numbers") ----
const R=1.9,leg=(id,name,php,book,refund)=>({id,name,nt:Math.round(php/R),book,...(refund?{refund}:{})});
if(S.settings.gross&&(S.v||1)<4){const st=S.settings;
 st.flights=[leg('w27d','Winter 2027 · flight to PH',9000,'2026-11'),leg('w27r','Winter 2027 · flight back to Taiwan (Feb 9)',9000,'2026-11'),
 leg('s27d','Summer 2027 · flight to PH',8000,'2027-03','2027-09'),leg('s27r','Summer 2027 · flight back to Taiwan',8000,'2027-03','2027-09'),
 leg('s27ad','Summer 2027 · abroad trip, flight out',12500,'2027-04'),leg('s27ar','Summer 2027 · abroad trip, flight back',12500,'2027-04'),
 leg('w28d','Winter 2028 · flight to PH',9000,'2027-10'),leg('w28r','Winter 2028 · flight back to Taiwan',9000,'2027-10'),
 leg('s28d','Summer 2028 · flight to PH',8000,'2028-03','2028-09'),leg('s28r','Summer 2028 · flight back to Taiwan',8000,'2028-03','2028-09'),
 leg('s28ad','Summer 2028 · abroad trip, flight out',12500,'2028-04'),leg('s28ar','Summer 2028 · abroad trip, flight back',12500,'2028-04')];
 const w=st.trips.find(t=>t.name==='Winter 2027');if(w)w.back='2027-02-09';
 st.floor=st.floor??40000;st.capTx=st.capTx??29900;st.capMonth=st.capMonth??50000;st.capYear=st.capYear??500000;st.mayaNet=st.mayaNet??0.04;
 S.actual={};S.v=4;save()}
const $=s=>document.querySelector(s);
const NT=n=>'NT$'+Math.round(n).toLocaleString('en-US');
const PH=n=>'₱'+Math.round(n).toLocaleString('en-US');
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');const key=(y,m)=>y+'-'+pad(m);
function d(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function monthsList(){const st=S.settings,[sy,sm]=st.start.split('-').map(Number),[ey,em]=st.end.split('-').map(Number);const out=[];let y=sy,m=sm;while(y<ey||(y===ey&&m<=em)){out.push([y,m]);m++;if(m>12){m=1;y++}}return out}
function dim(y,m){return new Date(y,m,0).getDate()}
function inTrip(t,x){return x>=d(t.out)&&x<=d(t.back)}
function awaySet(y,m){const s=new Set();for(const t of S.settings.trips)for(let i=1;i<=dim(y,m);i++)if(inTrip(t,new Date(y,m-1,i)))s.add(i);return s}
function tripOf(y,m){return S.settings.trips.find(t=>d(t.out)<=new Date(y,m,0)&&d(t.back)>=new Date(y,m-1,1))}
function weekdays(y,m){let n=0;for(let i=1;i<=dim(y,m);i++){const w=new Date(y,m-1,i).getDay();if(w&&w<6)n++}return n}
function leaveLeft(L){return L.total-L.used-L.beforeWinter-L.winter-L.sem2}
function unpaidDays(y,m){const L=S.settings.leave.find(l=>l.summer===key(y,m));return L?Math.max(0,weekdays(y,m)-leaveLeft(L)):0}
const av=(A,k,p)=>A[k]!=null?A[k]:p;   // actual if typed, else plan
// ---------- plan engine ----------
function plan(){const st=S.settings,rows=[];let bal=st.startBal,maya=st.maya,mp2=st.mp2,goty=st.gotyme,pending=0;const mp2Hist={},yearSent={};
 for(const[y,m]of monthsList()){const k=key(y,m),A=S.actual[k]||{};
  const away=awaySet(y,m),days=dim(y,m),frac=(days-away.size)/days,full=away.size>=28;
  const tax=(y>=st.highTaxFromYear&&st.highTaxMonths.includes(m))?0.18:0.05;
  const lunch=st.lunchMonths.includes(m)?st.lunch:0;
  const elecP=full?400:([6,7,8,9,10].includes(m)?st.elecSummer:st.elecNormal);
  const mondays=[];for(let i=1;i<=days;i++)if(new Date(y,m-1,i).getDay()===1&&!away.has(i))mondays.push(i);
  const unpaid=unpaidDays(y,m),gross=st.gross-Math.round(st.gross/30*unpaid);
  const netP=gross-st.ins-Math.round(gross*tax)-lunch, sal=av(A,'salary',netP);
  const rentP=st.rent+st.water, rent=rentP, elec=av(A,'elec',elecP);
  const legs=st.flights.filter(f=>f.book===k), flights=legs.reduce((s,f)=>s+av(A,'fl_'+f.id,f.nt),0);
  const refLegs=st.flights.filter(f=>f.refund===k); let refund=0;for(const f of refLegs){const bk=S.actual[f.book]||{};refund+=av(bk,'fl_'+f.id,f.nt)}
  const extra=m===8&&st.refunds[y]!=null?Math.round(st.bonusGross*(1-st.bonusTax))+st.refunds[y]:0;
  const cleanerP=full?0:Math.round(st.cleaner*frac), cleaner=av(A,'cleaner',cleanerP);
  const cash=mondays.length*st.cash;
  const cards=st.phone+st.spotify+Math.round((st.delivery+st.uber)*frac)+Math.round(st.fun*frac);
  const gcashNT=st.gcashNT, goNT=full?st.tfJuly:st.tripFund;
  let tripPhp=0;for(const t of st.trips){const tot=Math.round((d(t.back)-d(t.out))/864e5)+1;let n=0;for(let i=1;i<=days;i++)if(inTrip(t,new Date(y,m-1,i)))n++;tripPhp+=Math.round(t.php*n/tot)}
  const start=bal, before=start-rent-elec;
  // savings this month: never let Chunghwa Post end below the floor
  const saveWant=full?0:(tax<0.1?st.save5:st.save18);
  const room=before+sal+refund-cash-cards-cleaner-flights-gcashNT-goNT-st.floor;
  const saveNT=Math.max(0,Math.min(saveWant,Math.floor(room/100)*100));
  // remittance: apps limited per transaction / month / year; anything over waits for a teacher swap or bank transfer
  const due=gcashNT+goNT+saveNT+pending+extra;
  const yr=yearSent[y]||0, appRoom=Math.max(0,Math.min(st.capMonth,st.capYear-yr));
  const appPlan=Math.min(due,appRoom), appNT=av(A,'remit_nt',appPlan);
  const swapNT=A.swap_nt||0;
  pending=Math.max(0,due-appNT-swapNT); yearSent[y]=yr+appNT;
  const php=av(A,'remit_php',Math.round(appNT*st.rate))+(A.swap_php!=null?A.swap_php:Math.round(swapNT*st.rate));
  const end=before+sal+extra+refund-cash-cards-cleaner-flights-appNT-swapNT;
  // where the pesos go: GCash first, GoTyme next, the rest is savings (MP2 until full, then Maya)
  const gcashPhp=Math.min(php,Math.round(gcashNT*st.rate)), goPhp=Math.min(php-gcashPhp,Math.round(goNT*st.rate)), savePhp=php-gcashPhp-goPhp;
  let div=0;if(m===3){const h=mp2Hist[y-1]||[];const avg=h.length?(h.reduce((a,b)=>a+b,0)+st.mp2*(12-h.length))/12:st.mp2;div=Math.round(avg*st.mp2Rate);mp2+=div}
  maya+=Math.round(maya*(st.mayaNet??0.04)/12);
  const toMp2=Math.min(savePhp,Math.max(0,st.mp2Target-mp2)), toMaya=savePhp-toMp2;
  mp2+=toMp2;maya+=toMaya;goty+=goPhp-tripPhp;(mp2Hist[y]=mp2Hist[y]||[]).push(mp2);
  rows.push({y,m,k,A,tax,lunch,elecP,rentP,mondays,unpaid,netP,sal,legs,refund,extra,saveWant,saveNT,gcashNT,goNT,cash,cards,cleanerP,tripPhp,start,before,end,due,appPlan,appNT,swapNT,pending,yearSent:yearSent[y],php,gcashPhp,goPhp,toMp2,toMaya,div,maya,mp2,goty,total:maya+mp2+pending*st.rate,away:away.size,full,trip:tripOf(y,m),endAct:A.end});
  bal=av(A,'end',end)}
 return rows}
function splitApps(n){const c=S.settings.capTx;if(n<=0)return'';if(n<=c)return'one transfer (FEE or Pinoy Express)';return'FEE '+NT(Math.min(c,n))+' + Pinoy Express '+NT(n-Math.min(c,n))}
// ---------- checklist items (each can hold its real amount) ----------
function tasks(r,rows){const st=S.settings,ab=MN[r.m-1],T=[],I=[];
 if(r.tax===0.18&&r.m===1)I.push(['⚠️','Smaller salary from now until August (18% tax).']);
 if(r.m===9&&r.y>=st.highTaxFromYear)I.push(['✅','Tax should be back to 5% this month. If not, ask HR.']);
 if(r.lunch)I.push(['🍱','Lunch fee '+NT(r.lunch)+' comes out of this salary. Already counted.']);
 if(r.div)I.push(['🎉','MP2 dividend for last year (≈'+PH(r.div)+') should be in your MP2 now.']);
 if(r.refund)I.push(['💸','School pays back your summer PH tickets this month (≈'+NT(r.refund)+'), into your Chunghwa Post account.']);
 
 T.push({id:'rent',t:'Pay rent + water: '+NT(r.rentP),w:ab+' 1 · fixed'});
 T.push({id:'elec',t:'Pay electricity: '+(r.A.elec!=null?NT(r.A.elec):'≈ '+NT(r.elecP)),w:'NT$5 per kWh · changes every month',act:[['elec','Paid NT$',r.elecP]]});
 for(const f of r.legs)T.push({id:'fl_'+f.id,t:'Book '+f.name+(r.A['fl_'+f.id]!=null?': '+NT(r.A['fl_'+f.id]):''),w:'Budget ≈ '+NT(f.nt)+' (≈'+PH(f.nt*st.rate)+')'+(f.refund?' · school pays it back in '+MN[+f.refund.slice(5)-1]:''),act:[['fl_'+f.id,'Ticket price NT$',f.nt]]});
 T.push({id:'salary',t:'Salary arrives in your Chunghwa Post account: '+(r.A.salary!=null?NT(r.A.salary):'≈ '+NT(r.netP)),w:ab+' 5–8'+(r.unpaid?' · '+r.unpaid+' unpaid days taken out':''),act:[['salary','Received NT$',r.netP]]});
 if(r.full)I.push(['🌴','Summer trip: nothing goes to savings this month. Spend with your GoTyme card: '+PH(r.trip?r.trip.php:0)+' budget (PH + abroad).']);
 if(r.extra)I.push(['🎁','Bonus + tax refund (≈'+NT(r.extra)+') arrive in your Chunghwa Post account this month.']);
 T.push({id:'remit',t:'Remit app: change '+NT(r.appNT)+' to pesos',w:splitApps(r.appPlan)+' · ≈ '+PH(r.appPlan*st.rate),act:[['remit_nt','Sent NT$',r.appPlan],['remit_php','Received ₱',Math.round(r.appPlan*st.rate)]]});
 if(r.pending>0)T.push({id:'swap',t:NT(r.pending)+' left to change (remit apps full this month)',w:'Teacher swap or bank transfer — or it waits for next month. It still counts toward your goal.',act:[['swap_nt','Changed NT$',0],['swap_php','Received ₱',0]]});
 const tgt=r.mp2<st.mp2Target||r.toMp2>0?'MP2':'a Maya Personal Goal (max ₱100,000 each)';
 const parts=['GCash '+PH(r.gcashPhp)];if(r.goPhp)parts.push('GoTyme '+PH(r.goPhp));if(r.toMp2)parts.push('MP2 '+PH(r.toMp2));if(r.toMaya)parts.push('Maya goal '+PH(r.toMaya));
 T.push({id:'split',t:'Send the pesos: '+parts.join(' · '),w:'GCash = Mom ₱12,000 + vet ₱3,000 + subs ₱1,900'+(r.toMaya?' · Maya goals max ₱100,000 each':'')});
 if(r.cleanerP)T.push({id:'cleaner',t:'Pay the cleaner: '+(r.A.cleaner!=null?NT(r.A.cleaner):'≈ '+NT(r.cleanerP)),w:'This month',act:[['cleaner','Paid NT$',r.cleanerP]]});
 const nx=rows.find(x=>x.y*12+x.m===r.y*12+r.m+1);
 for(const t of st.trips){const o=d(t.out),here=o.getFullYear()===r.y&&o.getMonth()+1===r.m;
  if((here&&!r.full)||(nx&&nx.full&&nx.trip===t)){const have=r.goty+(here?r.tripPhp:0);T.push({id:'trip-'+t.out,t:'Before you fly: GoTyme ≈ '+PH(have)+' for '+t.name,w:'Budget '+PH(t.php)+(have>=t.php?' ✓ enough':' · short '+PH(t.php-have))+' · pay with your GoTyme card'})}}
 if(r.m===5)T.push({id:'tax',t:'FILE your '+(r.y-1)+' Taiwan income tax',w:'May 1–31 · no filing = no August refund'});
 if(r.m===8&&r.y===2028)T.push({id:'aprc',t:'APRC application',w:'August 2028'});
 T.push({id:'end',t:'Type your real Chunghwa Post balance',w:'End of '+ab+' · plan ≈ '+NT(r.end)+(r.pending?' (includes '+NT(r.pending)+' waiting to change)':''),act:[['end','Balance NT$',r.end]]});
 return{T,I}}
function goalLine(rows){const st=S.settings,goal=st.mp2Target+st.mayaTarget,hit=rows.find(r=>r.total>=goal),last=rows[rows.length-1];
 return hit?'₱'+(goal/1e6).toFixed(1)+'M reached: <b>'+MN[hit.m-1]+' '+hit.y+'</b> ✓':'By '+MN[last.m-1]+' '+last.y+': '+PH(last.total)+' of '+PH(goal)}
// ---------- UI ----------
let tab='today',cur=null;
function rowsNow(){const rows=plan();if(!cur){const n=new Date(),k=key(n.getFullYear(),n.getMonth()+1);const i=rows.findIndex(r=>r.k>=k);cur=rows[Math.max(0,i)].k}return rows}
function isDone(k,id){return!!(S.done[k]&&S.done[k][id])}
function toggle(k,id){S.done[k]=S.done[k]||{};S.done[k][id]=!S.done[k][id];save();render()}
function setAct(k,f,v){const s=String(v).replace(/[^0-9.\-]/g,'');S.actual[k]=S.actual[k]||{};if(s==='')delete S.actual[k][f];else S.actual[k][f]=Number(s);save();const y=scrollY;render();scrollTo(0,y)}
function ring(p,c){const r=44,C=2*Math.PI*r,v=Math.max(0,Math.min(1,p));return`<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="#eee9e2" stroke-width="12"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*v} ${C}" transform="rotate(-90 55 55)"/><text x="55" y="61" text-anchor="middle" font-size="19" font-weight="800" fill="#1d1d1f">${Math.round(v*100)}%</text></svg>`}
function donut(parts){let tot=parts.reduce((s,p)=>s+Math.max(p[1],0),0),acc=0,r=44,C=2*Math.PI*r,out='';for(const[n,v,c]of parts){if(v<=0)continue;const len=C*v/tot;out+=`<circle cx="55" cy="55" r="${r}" fill="none" stroke="${c}" stroke-width="14" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 55 55)"/>`;acc+=len}return`<svg width="110" height="110" viewBox="0 0 110 110">${out}</svg>`}
function bar(v,goal,c){return`<div class="bar"><i style="width:${Math.min(100,v/goal*100)}%;background:${c}"></i></div>`}
function render(){const app=$('#app');
 $('#nav').innerHTML=[['today','✔︎','This month'],['months','🗓','Months'],['money','₱','Money'],['settings','⚙︎','Settings']].map(([t,i,l])=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';render();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join('');
 if(!S.settings.gross&&tab!=='settings'){app.innerHTML=`<header><h1>My Plan</h1></header><main><div class="card empty">No plan loaded yet.<br><br>Open the private setup link Claude sent you, or go to <b>Settings → Restore from code</b>.</div></main>`;return}
 const rows=rowsNow();if(tab==='today')return renderToday(rows);if(tab==='months')return renderMonths(rows);if(tab==='money')return renderMoney(rows);renderSettings()}
function itemHTML(r,t){const dn=isDone(r.k,t.id);let pill='';
 if(t.act){const vals=t.act.filter(([f])=>r.A[f]!=null).map(([f,l])=>(l.includes('₱')?PH(r.A[f]):NT(r.A[f])));
  pill=`<button class="pill ${vals.length?'set':''}" onclick="event.stopPropagation();openAct('${r.k}','${t.id}')">${vals.length?'✓ Real amount':'✎ Real amount'}</button>`}
 return`<div class="task ${dn?'done':''}" onclick="toggle('${r.k}','${t.id}')"><div class="check">${dn?'✓':''}</div><div style="flex:1"><div class="t">${t.t}</div><div class="w">${t.w}</div>${pill}</div></div>`}
function openAct(k,id){const rows=plan(),r=rows.find(x=>x.k===k),t=tasks(r,rows).T.find(x=>x.id===id);
 $('#panel').innerHTML=`<h3>${t.t}</h3><p class="small" style="margin:0 4px 8px">Type what really happened. Leave empty to use the estimate.</p><div class="card">${t.act.map(([f,l,p])=>`<label class="f"><span>${l}</span><input inputmode="decimal" id="x_${f}" placeholder="estimate: ${Math.round(p).toLocaleString('en-US')}" value="${r.A[f]??''}"></label>`).join('')}</div>
 <button class="btn" onclick="saveAct('${k}','${id}')">Save</button><button class="btn light" onclick="closeSheet()">Cancel</button>`;$('#sheet').classList.add('open');setTimeout(()=>{const i=$('#panel input');if(i)i.focus()},50)}
function saveAct(k,id){const rows=plan(),r=rows.find(x=>x.k===k),t=tasks(r,rows).T.find(x=>x.id===id);S.actual[k]=S.actual[k]||{};
 for(const[f]of t.act){const v=$('#x_'+f).value.replace(/[^0-9.\-]/g,'');if(v==='')delete S.actual[k][f];else S.actual[k][f]=Number(v)}
 S.done[k]=S.done[k]||{};if(t.act.some(([f])=>S.actual[k][f]!=null))S.done[k][id]=true;save();closeSheet();const y=scrollY;render();scrollTo(0,y)}
function closeSheet(){$('#sheet').classList.remove('open')}
function renderToday(rows){const i=rows.findIndex(r=>r.k===cur),r=rows[i],{T,I}=tasks(r,rows),st=S.settings;
 const next=T.find(t=>!isDone(r.k,t.id)),goal=st.mp2Target+st.mayaTarget;
 const badge=r.full?'<span class="badge btrip">Trip</span>':(r.tax>0.1?'<span class="badge b18">18% tax</span>':'<span class="badge b5">5% tax</span>');
 const nt=st.trips.find(t=>d(t.back)>=new Date(r.y,r.m-1,1));
 $('#app').innerHTML=`<header><div><div class="sub">${r.y}</div><h1>${MNF[r.m-1]} ${badge}</h1></div><div class="monthnav"><button onclick="go(-1)">‹</button><button onclick="go(1)">›</button></div></header><main>
 ${next?`<div class="card next"><div class="label">Next step</div><div class="what">${next.t}</div><div class="when">${next.w}</div><button onclick="toggle('${r.k}','${next.id}')">Done ✓</button></div>`:`<div class="card next"><div class="label">This month</div><div class="what">All done! 🎉</div><div class="when">Nothing left for ${MNF[r.m-1]}.</div></div>`}
 ${I.map(x=>`<div class="info ${x[0]==='🌴'?'trip':''}"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}
 <div class="card"><h2>Checklist</h2>${T.map(t=>itemHTML(r,t)).join('')}</div>
 ${r.mondays.length?`<div class="card"><h2>Monday cash · ${NT(st.cash)} each</h2><div class="chips">${r.mondays.map(dd=>`<div class="chip ${isDone(r.k,'mon'+dd)?'on':''}" onclick="toggle('${r.k}','mon${dd}')">${isDone(r.k,'mon'+dd)?'✓ ':''}${MN[r.m-1]} ${dd}</div>`).join('')}</div></div>`:''}
 <div class="card"><h2>After ${MN[r.m-1]}</h2>
 <div class="row"><span>🏤 Chunghwa Post</span><span class="v">${NT(r.endAct??r.end)}</span></div>
 ${r.pending?`<div class="row"><span>⏳ Waiting to change to ₱</span><span class="v">${NT(r.pending)}</span></div>`:''}
 <div class="row"><span>✈️ GoTyme (trips)</span><span class="v ${r.goty<0?'warn':''}">${PH(r.goty)}</span></div>
 ${nt?`<p class="small">Next: ${nt.name} (${MN[d(nt.out).getMonth()]} ${d(nt.out).getDate()}) · budget ${PH(nt.php)}</p>`:''}</div>
 <div class="card" onclick="tab='money';render()"><h2>₱${(goal/1e6).toFixed(1)}M goal · after ${MN[r.m-1]}</h2><div class="ringwrap">${ring(r.total/goal,'#e8483f')}<div><div class="big">${PH(r.total)}</div><div class="sub">🔒 MP2 ${PH(r.mp2)}</div><div class="sub">💰 Maya ${PH(r.maya)}</div>${r.pending?`<div class="sub">🏤 NT$ not yet changed ≈ ${PH(r.pending*st.rate)}</div>`:''}</div></div><p class="small">${goalLine(rows)}</p></div></main>`}
function go(n){const rows=plan(),i=rows.findIndex(r=>r.k===cur);cur=rows[Math.max(0,Math.min(rows.length-1,i+n))].k;render()}
function renderMonths(rows){$('#app').innerHTML=`<header><h1>Months</h1></header><main><div class="card mlist">${rows.map(r=>{const done=S.done[r.k]?Object.values(S.done[r.k]).filter(Boolean).length:0;return`<div class="m" onclick="cur='${r.k}';tab='today';render();scrollTo(0,0)"><div><b>${MN[r.m-1]} ${r.y}</b>${r.away?'<span class="badge btrip">Trip</span>':''}${r.extra?'<span class="badge baug">Bonus</span>':''}<div class="sub">Remit ${NT(r.appPlan)} · savings ${PH(r.toMp2+r.toMaya)}</div></div><div style="text-align:right"><span class="badge ${r.tax>0.1?'b18':'b5'}">${Math.round(r.tax*100)}%</span><div class="sub">${done?done+' done':''}</div></div></div>`}).join('')}</div></main>`}
function renderMoney(rows){const r=rows.find(x=>x.k===cur)||rows[0],st=S.settings,last=rows[rows.length-1],A=r.A;
 const parts=[['Rent & water',r.rentP,'#f39c35'],['Electricity',av(A,'elec',r.elecP),'#f7c046'],['Remitted to PH',r.appNT+r.swapNT,'#e8483f'],['Monday cash',r.cash,'#3b6fd8'],['Cards & fun',r.cards,'#1f9e9a'],['Cleaner',av(A,'cleaner',r.cleanerP),'#7f8c8d'],['Flights',r.legs.reduce((s,f)=>s+av(A,'fl_'+f.id,f.nt),0),'#c0392b']];
 const rest=r.sal+r.refund+r.extra-parts.reduce((s,p)=>s+p[1],0);parts.push(rest>=0?['Stays in Chunghwa Post',rest,'#2fa36b']:['Taken from Chunghwa Post balance',-rest,'#b8b8bd']);
 $('#app').innerHTML=`<header><div><div class="sub">Money</div><h1>${MN[r.m-1]} ${r.y}</h1></div><div class="monthnav"><button onclick="go(-1)">‹</button><button onclick="go(1)">›</button></div></header><main>
 <div class="card"><h2>Where this salary goes</h2><div class="ringwrap">${donut(parts)}<div><div class="sub">Salary</div><div class="big">${NT(r.sal)}</div>${r.extra?`<div class="sub">+ bonus & refund ${NT(r.extra)}</div>`:''}${r.refund?`<div class="sub">+ ticket refund ${NT(r.refund)}</div>`:''}</div></div>
 ${parts.map(p=>p[1]?`<div class="row"><span><i class="dot" style="background:${p[2]}"></i>${p[0]}</span><span class="v">${NT(p[1])}</span></div>`:'').join('')}</div>
 <div class="card"><h2>Pesos this month (${PH(r.php)})</h2>
 <div class="row"><span>📱 GCash (Mom & subs)</span><span class="v">${PH(r.gcashPhp)}</span></div>
 <div class="row"><span>✈️ GoTyme (trips)</span><span class="v">${PH(r.goPhp)}</span></div>
 <div class="row"><span>🔒 MP2</span><span class="v">${PH(r.toMp2)}</span></div>
 <div class="row"><span>💰 Maya</span><span class="v">${PH(r.toMaya)}</span></div>
 <p class="small">Remit apps this year: ${NT(r.yearSent)} of ${NT(st.capYear)} yearly limit.</p></div>
 <div class="card"><h2>Accounts after ${MN[r.m-1]}</h2>
 <div class="row"><span>🏤 Chunghwa Post</span><span class="v">${NT(r.endAct??r.end)}</span></div>
 ${r.pending?`<div class="row"><span>⏳ of which waiting to change</span><span class="v">${NT(r.pending)}</span></div>`:''}
 <div class="row"><span>🔒 MP2</span><span class="v">${PH(r.mp2)}</span></div>
 <div class="row"><span>💰 Maya (goals + savings)</span><span class="v">${PH(r.maya)}</span></div>
 <div class="row"><span>✈️ GoTyme (trips)</span><span class="v ${r.goty<0?'warn':''}">${PH(r.goty)}</span></div>
 <div class="row"><span>Lowest before payday</span><span class="v">${NT(r.before)}</span></div></div>
 <div class="card"><h2>Goal · ${MN[last.m-1]} ${last.y}</h2>
 <div class="row"><span>🔒 MP2 → ${PH(st.mp2Target)}</span><span class="v">${PH(last.mp2)}</span></div>${bar(last.mp2,st.mp2Target,'var(--purple)')}
 <div class="row" style="margin-top:8px"><span>💰 Maya → ${PH(st.mayaTarget)}</span><span class="v">${PH(last.maya)}</span></div>${bar(last.maya,st.mayaTarget,'var(--green)')}
 ${last.pending?`<div class="row" style="margin-top:8px"><span>🏤 NT$ not yet changed</span><span class="v">${NT(last.pending)} ≈ ${PH(last.pending*st.rate)}</span></div>`:''}
 <div class="row" style="margin-top:8px"><span><b>Total savings</b></span><span class="v">${PH(last.total)}</span></div>
 <p class="small" style="font-size:15px;color:var(--ink)">${goalLine(rows)}</p><p class="small">Uses ${st.rate.toFixed(2)} ₱ per NT$1 until you type what you really received.</p></div></main>`}
const FIELDS=[['Each payday',[['save5','Savings — 5% tax months (NT$)'],['save18','Savings — 18% tax months (NT$)'],['tripFund','GoTyme for trips (NT$)'],['tfJuly','GoTyme in July (NT$)'],['gcashNT','GCash — Mom & subs (NT$)'],['cash','Monday cash (NT$)'],['floor','Keep at least this in Chunghwa Post (NT$)']]],
['Remit app limits',[['capTx','Per transfer (NT$)'],['capMonth','Per month, all apps (NT$)'],['capYear','Per year, all apps (NT$)']]],
['Bills & spending',[['rent','Rent (NT$)'],['water','Water (NT$)'],['elecNormal','Electricity estimate, normal (NT$)'],['elecSummer','Electricity estimate, summer (NT$)'],['cleaner','Cleaner / month (NT$)'],['delivery','Food delivery / month (NT$)'],['uber','Uber / taxi / month (NT$)'],['fun','Local trips & fun / month (NT$)'],['phone','Phone (NT$)'],['spotify','Spotify (NT$)']]],
['Pay',[['gross','Gross pay incl. housing (NT$)'],['ins','Insurance (NT$)'],['lunch','Lunch fee per semester (NT$)'],['bonusGross','Bonus (NT$)']]],
['Accounts & goals',[['startBal','Chunghwa Post at start (NT$)'],['mp2','MP2 at start (₱)'],['maya','Maya at start (₱)'],['gotyme','GoTyme at start (₱)'],['mp2Target','MP2 goal (₱)'],['mayaTarget','Maya goal (₱)'],['mp2Rate','MP2 dividend rate (0.0712 = 7.12%)'],['mayaNet','Maya interest after tax (0.04 = 4%)'],['rate','₱ per NT$1 (planning rate)']]]];
function renderSettings(){const st=S.settings;
 $('#app').innerHTML=`<header><h1>Settings</h1></header><main>
 ${FIELDS.map(([g,fs])=>`<div class="card"><h2>${g}</h2>${fs.map(([f,l])=>`<label class="f"><span>${l}</span><input inputmode="decimal" value="${st[f]??''}" onchange="setNum('${f}',this.value)"></label>`).join('')}</div>`).join('')}
 <div class="card"><h2>Trips (spending from GoTyme)</h2>${st.trips.map((t,i)=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${t.name}</b><label class="f"><span>Fly out</span><input type="date" value="${t.out}" onchange="setTrip(${i},'out',this.value)"></label><label class="f"><span>Back</span><input type="date" value="${t.back}" onchange="setTrip(${i},'back',this.value)"></label><label class="f"><span>Spending budget (₱)</span><input inputmode="decimal" value="${t.php}" onchange="setTrip(${i},'php',this.value)"></label></div>`).join('')}</div>
 <div class="card"><h2>Flight budgets (one-way)</h2><p class="small">Type the real price in each month's checklist when you book.</p>${st.flights.map((f,i)=>`<label class="f"><span>${f.name} · book ${MN[+f.book.slice(5)-1]} ${f.book.slice(0,4)}${f.refund?' · school pays back':''}</span><input inputmode="decimal" value="${f.nt}" onchange="setFl(${i},this.value)"></label>`).join('')}</div>
 <div class="card"><h2>Paid leave</h2>${st.leave.map((L,i)=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>Summer ${L.summer.slice(0,4)}</b> · ${leaveLeft(L)} paid days left → <b>${unpaidDays(+L.summer.slice(0,4),+L.summer.slice(5))} unpaid</b>${[['total','Paid days in contract'],['used','Already used'],['beforeWinter','Used before winter'],['winter','Winter trip workdays'],['sem2','Used in 2nd semester']].map(([f,l])=>`<label class="f"><span>${l}</span><input inputmode="decimal" value="${L[f]}" onchange="setLeave(${i},'${f}',this.value)"></label>`).join('')}</div>`).join('')}</div>
 <div class="card"><h2>Backup</h2><p class="small">Copy this code and keep it in Notes (or send it to Claude). If your phone ever loses the app data, paste it back.</p><button class="btn" onclick="backup()">Copy backup code</button><textarea id="bk" placeholder="Paste a code here to restore"></textarea><button class="btn light" onclick="restore()">Restore from code</button></div>
 <p class="small" style="text-align:center">Your numbers stay on this phone only. App version 9.</p></main>`}
function num(v){return Number(String(v).replace(/[^0-9.\-]/g,''))||0}
function setNum(f,v){S.settings[f]=num(v);save()}
function setTrip(i,f,v){S.settings.trips[i][f]=(f==='out'||f==='back')?v:num(v);save()}
function setFl(i,v){S.settings.flights[i].nt=num(v);save()}
function setLeave(i,f,v){S.settings.leave[i][f]=num(v);save();render()}
function backup(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#bk').value=c;try{navigator.clipboard.writeText(c);toast('Copied ✓')}catch(e){}}
function restore(){try{S=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));save();cur=null;tab='today';render();scrollTo(0,0)}catch(e){toast('That code didn\'t work')}}
function toast(t){const b=document.createElement('div');b.textContent=t;b.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 18px;border-radius:20px;z-index:20;font-weight:600';document.body.appendChild(b);setTimeout(()=>b.remove(),1600)}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=true;location.reload()}})}
</script>
</body>
</html>

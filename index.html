<!DOCTYPE html>
<html lang="en">
<head>

<title>My Plan</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1d1f;--sub:#6e6e73;--line:#ebe8e3;--red:#e8483f;--orange:#f39c35;--green:#2fa36b;--blue:#3b6fd8;--purple:#8d5bd6;--teal:#1f9e9a;--warn:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;font-size:17px}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
header{padding:14px 18px 6px;display:flex;align-items:center;justify-content:space-between}
h1{font-size:30px;margin:0;letter-spacing:-.5px}
.sub{color:var(--sub);font-size:14px}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav button{border:0;background:var(--card);width:38px;height:38px;border-radius:19px;font-size:20px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{padding:0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.check{flex:none;width:28px;height:28px;border-radius:14px;border:2px solid #cfcac3;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;margin-top:1px}
.task.done .check{background:var(--green);border-color:var(--green)}
.task.done .t{color:var(--sub);text-decoration:line-through}
.task .t{font-size:17px;line-height:1.3}
.task .w{font-size:13px;color:var(--sub);margin-top:2px}
.cur{margin-left:6px;font-size:12px;color:var(--blue);border:1px solid #dcd7d0;border-radius:10px;padding:2px 8px;background:#fff}
.real{font-size:15px;font-weight:700;color:var(--green);margin-top:4px}
.pill{margin-top:8px;border:1px solid #dcd7d0;background:#fff;border-radius:16px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--blue)}

.trip{background:#fdecea}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.on{background:#e6f5ec;border-color:var(--green);color:var(--green)}
.ringwrap{display:flex;align-items:center;gap:16px}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.row:first-of-type{border-top:0}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:6px}

nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}

.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.panel h3{margin:4px 4px 8px;font-size:22px}
label.f{display:block;padding:10px 0;border-top:1px solid var(--line)}
label.f:first-of-type{border-top:0}
label.f span{display:block;font-size:14px;color:var(--sub);margin-bottom:6px}
input{width:100%;font-size:18px;padding:11px 12px;border:1px solid #dcd7d0;border-radius:12px;background:#fff;font-family:inherit}
.btn{width:100%;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:10px;background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink);border:1px solid #dcd7d0}
textarea{width:100%;height:110px;font-size:13px;border-radius:12px;border:1px solid #dcd7d0;padding:10px;font-family:ui-monospace,monospace}
.empty{text-align:center;padding:40px 20px;color:var(--sub)}
.warn{color:var(--warn);font-weight:700}
.small{font-size:13px;color:var(--sub);line-height:1.4}
.hero{background:linear-gradient(135deg,#fff3ea,#f6f4f1);padding-bottom:12px}
.prog{height:8px;width:180px;background:#eee4da;border-radius:4px;margin:10px 0 4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);border-radius:4px}
.notes{margin:4px 0 6px}.note{font-size:14px;background:#fff;border-radius:12px;padding:8px 12px;margin:6px 0;color:#444;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.sec{background:#fff;border-radius:18px;margin:12px 0;padding:6px 14px 10px;border-left:6px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sh{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:16px;padding:10px 0 4px;color:var(--c)}
.cnt{font-size:13px;background:#f3f1ee;color:#666;border-radius:10px;padding:2px 9px}
.it{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.ck{flex:none;width:30px;height:30px;border-radius:15px;border:2.5px solid #cfcac3;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.it.done .ck{background:var(--green);border-color:var(--green)}
.it.done .tt{color:var(--sub);text-decoration:line-through}
.bd{flex:1;min-width:0}.tt{font-size:17px;font-weight:600;line-height:1.25}.ww{font-size:13px;color:var(--sub);margin-top:2px}
.am{text-align:right;font-weight:800;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ed{display:block;font-size:12px;font-weight:600;color:var(--blue);margin-top:4px}
.real{font-size:14px;font-weight:700;color:var(--green);margin-top:4px}
.more{font-size:14px;color:var(--sub);padding:10px 0 2px;text-align:center}
.mon{padding:12px 0;border-top:1px solid var(--line)}
.goal{background:linear-gradient(135deg,#fff,#fdeeee)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div>
<script>
const KEY='myplan.v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
(function(){const h=location.hash;if(!h.startsWith('#setup='))return;try{const N=JSON.parse(decodeURIComponent(escape(atob(h.slice(7)))));if(!S||(N.v||1)>(S.v||1)){N.done=(S&&S.done)||{};N.actual=(S&&S.actual)||{};S=N;save()}}catch(e){}})();
if(!S)S={v:0,settings:{gross:0,trips:[],flights:[],leave:[],lunchMonths:[],highTaxMonths:[],refunds:{},start:"2026-11",end:"2028-08"},actual:{},done:{}};
// ---- upgrade to v4 (keeps your settings, replaces flights with one-way legs, clears old "real numbers") ----
const R=1.9,leg=(id,name,php,book,refund)=>({id,name,nt:Math.round(php/R),book,...(refund?{refund}:{})});
if(S.settings.gross&&(S.v||1)<4){const st=S.settings;
 st.flights=[leg('w27d','Winter 2027 · flight to PH',9000,'2026-11'),leg('w27r','Winter 2027 · flight back to Taiwan (Feb 9)',9000,'2026-11'),
 leg('s27d','Summer 2027 · flight to PH',8000,'2027-03','2027-09'),leg('s27r','Summer 2027 · flight back to Taiwan',8000,'2027-03','2027-09'),
 leg('s27ad','Summer 2027 · abroad trip, flight out',12500,'2027-04'),leg('s27ar','Summer 2027 · abroad trip, flight back',12500,'2027-04'),
 leg('w28d','Winter 2028 · flight to PH',9000,'2027-10'),leg('w28r','Winter 2028 · flight back to Taiwan',9000,'2027-10'),
 leg('s28d','Summer 2028 · flight to PH',8000,'2028-03','2028-09'),leg('s28r','Summer 2028 · flight back to Taiwan',8000,'2028-03','2028-09'),
 leg('s28ad','Summer 2028 · abroad trip, flight out',12500,'2028-04'),leg('s28ar','Summer 2028 · abroad trip, flight back',12500,'2028-04')];
 const w=st.trips.find(t=>t.name==='Winter 2027');if(w)w.back='2027-02-09';
 st.floor=st.floor??40000;st.capTx=st.capTx??29900;st.capMonth=st.capMonth??50000;st.capYear=st.capYear??500000;st.mayaNet=st.mayaNet??0.04;
 S.actual={};S.v=4;save()}
const $=s=>document.querySelector(s);
const NT=n=>'NT$'+Math.round(n).toLocaleString('en-US');
const PH=n=>'₱'+Math.round(n).toLocaleString('en-US');
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0');const key=(y,m)=>y+'-'+pad(m);
function d(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function monthsList(){const st=S.settings,[sy,sm]=st.start.split('-').map(Number),[ey,em]=st.end.split('-').map(Number);const out=[];let y=sy,m=sm;while(y<ey||(y===ey&&m<=em)){out.push([y,m]);m++;if(m>12){m=1;y++}}return out}
function dim(y,m){return new Date(y,m,0).getDate()}
function inTrip(t,x){return x>=d(t.out)&&x<=d(t.back)}
function awaySet(y,m){const s=new Set();for(const t of S.settings.trips)for(let i=1;i<=dim(y,m);i++)if(inTrip(t,new Date(y,m-1,i)))s.add(i);return s}
function tripOf(y,m){return S.settings.trips.find(t=>d(t.out)<=new Date(y,m,0)&&d(t.back)>=new Date(y,m-1,1))}
function weekdays(y,m){let n=0;for(let i=1;i<=dim(y,m);i++){const w=new Date(y,m-1,i).getDay();if(w&&w<6)n++}return n}
function leaveLeft(L){return L.total-L.used-L.beforeWinter-L.winter-L.sem2}
function unpaidDays(y,m){const L=S.settings.leave.find(l=>l.summer===key(y,m));return L?Math.max(0,weekdays(y,m)-leaveLeft(L)):0}
const av=(A,k,p)=>A[k]!=null?A[k]:p;
let liveRate=null;function getRate(){if(liveRate)return Promise.resolve(liveRate);return fetch('https://open.er-api.com/v6/latest/TWD').then(r=>r.json()).then(j=>{liveRate=j.rates&&j.rates.PHP?+j.rates.PHP.toFixed(4):null;return liveRate||S.settings.rate}).catch(()=>S.settings.rate)}   // actual if typed, else plan
// ---------- plan engine ----------
function plan(){const st=S.settings,rows=[];let bal=st.startBal,maya=st.maya,mp2=st.mp2,goty=st.gotyme,gcash=st.gcash??11000,pending=0;const mp2Hist={},yearSent={};
 for(const[y,m]of monthsList()){const k=key(y,m),A=S.actual[k]||{};
  const away=awaySet(y,m),days=dim(y,m),frac=(days-away.size)/days,full=away.size>=28;
  const tax=(y>=st.highTaxFromYear&&st.highTaxMonths.includes(m))?0.18:0.05;
  const lunch=st.lunchMonths.includes(m)?st.lunch:0;
  const elecP=full?400:([6,7,8,9,10].includes(m)?st.elecSummer:st.elecNormal);
  const mondays=[];for(let i=1;i<=days;i++)if(new Date(y,m-1,i).getDay()===1&&!away.has(i))mondays.push(i);
  const unpaid=unpaidDays(y,m),gross=st.gross-Math.round(st.gross/30*unpaid);
  const netP=gross-st.ins-Math.round(gross*tax)-lunch, sal=av(A,'salary',netP);
  const rentP=st.rent+st.water, rent=rentP, elec=av(A,'elec',elecP);
  const legs=st.flights.filter(f=>f.book===k), flights=legs.reduce((s,f)=>s+av(A,'fl_'+f.id,f.nt),0);
  const refLegs=st.flights.filter(f=>f.refund===k); let refund=0;for(const f of refLegs){const bk=S.actual[f.book]||{};refund+=av(bk,'fl_'+f.id,f.nt)}
  const extra=m===8&&st.refunds[y]!=null?Math.round(st.bonusGross*(1-st.bonusTax))+st.refunds[y]:0;
  const cleanerP=full?0:Math.round(st.cleaner*frac), cleaner=av(A,'cleaner',cleanerP);
  const cash=mondays.length*st.cash;
  const cards=st.phone+st.spotify+Math.round((st.delivery+st.uber)*frac)+Math.round(st.fun*frac);
  const gcashNT=st.gcashNT, goNT=full?st.tfJuly:st.tripFund;
  let tripPhp=0;for(const t of st.trips){const tot=Math.round((d(t.back)-d(t.out))/864e5)+1;let n=0;for(let i=1;i<=days;i++)if(inTrip(t,new Date(y,m-1,i)))n++;tripPhp+=Math.round(t.php*n/tot)}
  if(A.trip_php!=null)tripPhp=A.trip_php;
  const start=bal, before=start-rent-elec;
  // savings this month: never let Chunghwa Post end below the floor
  const saveWant=full?0:(tax<0.1?st.save5:st.save18);
  const room=before+sal+refund-cash-cards-cleaner-flights-gcashNT-goNT-st.floor;
  const saveNT=Math.max(0,Math.min(saveWant,Math.floor(room/100)*100));
  // remittance: apps limited per transaction / month / year; anything over waits for a teacher swap or bank transfer
  const due=gcashNT+goNT+saveNT+pending+extra;
  const yr=yearSent[y]||0, appRoom=Math.max(0,Math.min(st.capMonth,st.capYear-yr));
  const fam=gcashNT+goNT, sav=due-fam, famP=Math.min(fam,appRoom,st.capTx), savP=Math.min(sav,appRoom-famP);
  const feeP=Math.min(savP,st.capTx), peP=famP+Math.min(savP-feeP,st.capTx-famP), appPlan=feeP+peP;
  const feeNT=av(A,'fee_nt',av(A,'remit_nt',feeP)), peNT=av(A,'pe_nt',peP), appNT=feeNT+peNT;
  const swapNT=A.swap_nt||0;
  pending=Math.max(0,due-appPlan-swapNT); yearSent[y]=yr+appNT;
  const php=av(A,'fee_php',av(A,'remit_php',Math.round(feeNT*st.rate)))+av(A,'pe_php',Math.round(peNT*st.rate))+(A.swap_php!=null?A.swap_php:Math.round(swapNT*st.rate));
  // where the pesos go: GCash first, GoTyme next, the rest is savings
  const gcashPhp=av(A,'gcash_php',Math.min(php,Math.round(gcashNT*st.rate))), goPhp=av(A,'goty_php',Math.min(Math.max(0,php-gcashPhp),Math.round(goNT*st.rate))), savePhp=Math.max(0,php-gcashPhp-goPhp);
  let div=0;if(m===3){const h=mp2Hist[y-1]||[];const avg=h.length?(h.reduce((a,b)=>a+b,0)+st.mp2*(12-h.length))/12:st.mp2;div=Math.round(avg*st.mp2Rate)}
  const mInt=Math.round(maya*(st.mayaNet??0.04)/12), mp2c=mp2+div;
  const mayaFirst=k<=(st.mayaFirstUntil||'2026-12'), share=st.mp2Share??0.65;
  let pM=mayaFirst?0:Math.min(Math.round(savePhp*share),Math.max(0,st.mp2Target-mp2c)), pY=savePhp-pM;
  if(maya>=st.mayaTarget&&!mayaFirst){pM=Math.min(savePhp,Math.max(0,st.mp2Target-mp2c));pY=savePhp-pM}
  let toMp2=pM,toMaya=pY;
  if(A.mp2_php!=null&&A.maya_php!=null){toMp2=A.mp2_php;toMaya=A.maya_php}else if(A.mp2_php!=null){toMp2=A.mp2_php;toMaya=Math.max(0,savePhp-toMp2)}else if(A.maya_php!=null){toMaya=A.maya_php;toMp2=Math.max(0,savePhp-toMaya)}
  // every checklist step moves money between accounts
  const gcSpend=st.gcashSpend??16900;
  const D=[['rent',{cp:-rentP}],['elec',{cp:-elec}],...legs.map(f=>['fl_'+f.id,{cp:-av(A,'fl_'+f.id,f.nt)}]),['salary',{cp:sal}],
   ['fee',{cp:-feeNT,mp2:toMp2,maya:toMaya}],['pe',{cp:-peNT,gc:gcashPhp,goty:goPhp}],['swap',{cp:-swapNT}],['cleaner',{cp:-cleaner}],
   ...mondays.map(dd=>['mon'+dd,{cp:-st.cash}]),['tripspend',{goty:-tripPhp}]];
  const spread={cp:-cards,maya:mInt}, lump={cp:extra+refund,mp2:div,gc:-gcSpend};
  const acc0={cp:start,mp2,maya,goty,gc:gcash}, ks=['cp','mp2','maya','goty','gc'];
  const add=(o,d,f=1)=>{for(const x of ks)o[x]+=(d[x]||0)*f;return o};
  const dn=S.done[k]||{}, sn=S.snap&&S.snap.k===k?S.snap:null;
  let fin, chk=null;
  if(sn){const f=Math.min(1,sn.day/days);const exp=add(add({...acc0},spread,f),f>=0.5?lump:{});for(const[id,d]of D)if(dn[id])add(exp,d);
   chk={exp,real:{cp:sn.cp,mp2:sn.mp2,maya:sn.maya,goty:sn.goty,gc:sn.gc},day:sn.day};
   fin=add(add({...chk.real},spread,1-f),f<0.5?lump:{});for(const[id,d]of D)if(!dn[id])add(fin,d)}
  else{fin=add(add({...acc0},spread),lump);for(const[,d]of D)add(fin,d)}
  const end=Math.round(fin.cp);
  mp2=fin.mp2;maya=fin.maya;goty=fin.goty;gcash=fin.gc;(mp2Hist[y]=mp2Hist[y]||[]).push(mp2);
  rows.push({y,m,k,A,feeP,peP,feeNT,peNT,tax,lunch,elecP,rentP,mondays,unpaid,netP,sal,legs,refund,extra,saveWant,saveNT,gcashNT,goNT,cash,cards,cleanerP,tripPhp,start,before,end,due,appPlan,appNT,swapNT,pending,yearSent:yearSent[y],php,gcashPhp,goPhp,toMp2,toMaya,div,maya,mp2,goty,gcash,chk,acc0,total:maya+mp2+pending*st.rate,away:away.size,full,trip:tripOf(y,m),endAct:A.end});
  bal=av(A,'end',end)}
 return rows}
function splitApps(n){const c=S.settings.capTx;if(n<=0)return'';if(n<=c)return'one transfer (FEE or Pinoy Express)';return'FEE '+NT(Math.min(c,n))+' + Pinoy Express '+NT(n-Math.min(c,n))}
// ---------- checklist items (each can hold its real amount) ----------
function tasks(r,rows){const st=S.settings,ab=MN[r.m-1],T=[],I=[];
 if(r.tax===0.18&&r.m===1)I.push(['⚠️','Smaller salary until August (18% tax).']);
 if(r.m===9&&r.y>=st.highTaxFromYear)I.push(['✅','Tax should be back to 5% this month.']);
 if(r.lunch)I.push(['🍱','Lunch fee '+NT(r.lunch)+' comes out of this salary.']);
 if(r.div)I.push(['🎉','MP2 dividend ≈ '+PH(r.div)+' this month.']);
 if(r.refund)I.push(['💸','School pays back your summer tickets ≈ '+NT(r.refund)+'.']);

 <p class="small" style="font-size:15px;color:var(--ink)">${goalLine(rows)}</p><p class="small">Uses ${st.rate.toFixed(2)} ₱ per NT$1 until you type what you really received.</p></div></main>`}
const FIELDS=[['Each payday',[['save5','Savings — 5% tax months (NT$)'],['save18','Savings — 18% tax months (NT$)'],['tripFund','GoTyme for trips (NT$)'],['tfJuly','GoTyme in July (NT$)'],['gcashNT','GCash — Mom & subs (NT$)'],['cash','Monday cash (NT$)'],['floor','Keep at least this in Chunghwa Post (NT$)']]],
['Remit app limits',[['capTx','Per transfer (NT$)'],['capMonth','Per month, FEE + Pinoy Express together (NT$)'],['capYear','Per year, all apps (NT$)']]],
['Savings split',[['mp2Share','Share to MP2 after Maya-first months (0.65 = 65%)']]],
['Bills & spending',[['rent','Rent (NT$)'],['water','Water (NT$)'],['elecNormal','Electricity estimate, normal (NT$)'],['elecSummer','Electricity estimate, summer (NT$)'],['cleaner','Cleaner / month (NT$)'],['delivery','Food delivery / month (NT$)'],['uber','Uber / taxi / month (NT$)'],['fun','Local trips & fun / month (NT$)'],['phone','Phone (NT$)'],['spotify','Spotify (NT$)']]],
['Pay',[['gross','Gross pay incl. housing (NT$)'],['ins','Insurance (NT$)'],['lunch','Lunch fee per semester (NT$)'],['bonusGross','Bonus (NT$)']]],
['Accounts & goals',[['startBal','Chunghwa Post at start (NT$)'],['mp2','MP2 at start (₱)'],['maya','Maya at start (₱)'],['gotyme','GoTyme at start (₱)'],['gcash','GCash at start (₱)'],['gcashSpend','GCash spent per month (₱): Mom + vet + subs'],['mp2Target','MP2 goal (₱)'],['mayaTarget','Maya goal (₱)'],['mp2Rate','MP2 dividend rate (0.0712 = 7.12%)'],['mayaNet','Maya interest after tax (0.04 = 4%)'],['rate','₱ per NT$1 (planning rate)']]]];
function renderSettings(){const st=S.settings;
 $('#app').innerHTML=`<header><h1>Settings</h1></header><main>
 ${FIELDS.map(([g,fs])=>`<div class="card"><h2>${g}</h2>${fs.map(([f,l])=>`<label class="f"><span>${l}</span><input inputmode="decimal" value="${st[f]??''}" onchange="setNum('${f}',this.value)"></label>`).join('')}</div>`).join('')}
 <div class="card"><h2>Trips (spending from GoTyme)</h2>${st.trips.map((t,i)=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>${t.name}</b><label class="f"><span>Fly out</span><input type="date" value="${t.out}" onchange="setTrip(${i},'out',this.value)"></label><label class="f"><span>Back</span><input type="date" value="${t.back}" onchange="setTrip(${i},'back',this.value)"></label><label class="f"><span>Spending budget (₱)</span><input inputmode="decimal" value="${t.php}" onchange="setTrip(${i},'php',this.value)"></label></div>`).join('')}</div>
 <div class="card"><h2>Flight budgets (one-way)</h2><p class="small">Type the real price in each month's checklist when you book.</p>${st.flights.map((f,i)=>`<label class="f"><span>${f.name} · book ${MN[+f.book.slice(5)-1]} ${f.book.slice(0,4)}${f.refund?' · school pays back':''}</span><input inputmode="decimal" value="${f.nt}" onchange="setFl(${i},this.value)"></label>`).join('')}</div>
 <div class="card"><h2>Paid leave</h2>${st.leave.map((L,i)=>`<div style="padding:8px 0;border-top:1px solid var(--line)"><b>Summer ${L.summer.slice(0,4)}</b> · ${leaveLeft(L)} paid days left → <b>${unpaidDays(+L.summer.slice(0,4),+L.summer.slice(5))} unpaid</b>${[['total','Paid days in contract'],['used','Already used'],['beforeWinter','Used before winter'],['winter','Winter trip workdays'],['sem2','Used in 2nd semester']].map(([f,l])=>`<label class="f"><span>${l}</span><input inputmode="decimal" value="${L[f]}" onchange="setLeave(${i},'${f}',this.value)"></label>`).join('')}</div>`).join('')}</div>
 <div class="card"><h2>Backup</h2><p class="small">Copy this code and keep it in Notes (or send it to Claude). If your phone ever loses the app data, paste it back.</p><button class="btn" onclick="backup()">Copy backup code</button><textarea id="bk" placeholder="Paste a code here to restore"></textarea><button class="btn light" onclick="restore()">Restore from code</button></div>
 <p class="small" style="text-align:center">Your numbers stay on this phone only. App version 15.</p></main>`}
function num(v){return Number(String(v).replace(/[^0-9.\-]/g,''))||0}
function setNum(f,v){S.settings[f]=num(v);save()}
function setTrip(i,f,v){S.settings.trips[i][f]=(f==='out'||f==='back')?v:num(v);save()}
function setFl(i,v){S.settings.flights[i].nt=num(v);save()}
function setLeave(i,f,v){S.settings.leave[i][f]=num(v);save();render()}
function backup(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#bk').value=c;try{navigator.clipboard.writeText(c);toast('Copied ✓')}catch(e){}}
function restore(){try{S=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));save();cur=null;tab='today';render();scrollTo(0,0)}catch(e){toast('That code didn\'t work')}}
function toast(t){const b=document.createElement('div');b.textContent=t;b.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:10px 18px;border-radius:20px;z-index:20;font-weight:600';document.body.appendChild(b);setTimeout(()=>b.remove(),1600)}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!rl){rl=true;location.reload()}})}
</script>
</body>
